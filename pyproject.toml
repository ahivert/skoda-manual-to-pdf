[project]
name = "skoda-manual-cli"
version = "0.1.0"
description = "Export a Škoda owner's documentation as an offline PDF"
requires-python = ">=3.11"
dependencies = ["playwright>=1.58,<2", "beautifulsoup4>=4.14,<5", "pypdf>=6.7,<7"]

[project.scripts]
skoda-manual = "skoda_manual:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skoda_manual.py"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
